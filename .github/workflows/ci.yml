name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck all workspace packages
        run: pnpm typecheck

  python-sdk:
    name: Python SDK smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the SDK
        run: pip install -e sdk/python
      - name: Import smoke test
        run: |
          python -c "from electrohire import ElectroHireClient, __version__; c = ElectroHireClient('http://127.0.0.1:1'); print('electrohire', __version__, 'import ok:', c)"

  connectors:
    name: Connector guides validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Validate connector registry and config examples
        run: node tools/validate-connectors.mjs
