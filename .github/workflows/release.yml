name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: GitHub Release from tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Extract this version's CHANGELOG section
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release $GITHUB_REF_NAME" > release-notes.md
          fi
          cat release-notes.md

      - name: Create the GitHub Release (skip if it already exists)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leaving it unchanged."
          else
            # Tolerate a release created outside this workflow (e.g. manually
            # at tag time): if the create loses that race, succeed as long as
            # the release exists afterwards.
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              || gh release view "$GITHUB_REF_NAME" > /dev/null
          fi
