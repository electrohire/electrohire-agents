# ElectroHire Ellie service Worker (Phase E).
# This committed config IS the deploy config for the beta surface: the
# custom-domain route and the D1 binding to the platform store
# (electrohire-platform) are committed, so a deploy from this file
# reproduces the served end state.
#
# R2 binding (2026-10-25): R2 is enabled on this account and the one
# platform bucket electrohire-uploads is bound here as FILES. Upload
# bytes live in the bucket under ellie/<session_id>/<upload_id>
# (migration 0011 added ellie_uploads.r2_key); the D1 BLOB path in
# packages/platform/src/ellie/store.ts remains the no-bucket fallback.
# The 2 MB upload cap is unchanged — it is a product limit pinned by
# the frozen Phase E battery, not a storage limit.
#
# Secrets are NOT in this file and are placed separately with
# `wrangler secret put`: OPENROUTER_API_KEY (dedicated platform key,
# owner-side step — until it exists, Ellie answers with the honest
# not-configured fallback), TURNSTILE_SECRET_KEY, ELLIE_INTERNAL_KEY.
name = "electrohire-ellie"
main = "src/index.ts"
compatibility_date = "2025-06-01"
routes = [{ pattern = "ellie-beta.electrohire.com", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "electrohire-platform"
database_id = "c7aea331-7159-438c-a957-51632558a3c9"

[[r2_buckets]]
binding = "FILES"
bucket_name = "electrohire-uploads"

# Static assets: the real panel bundle in apps/ellie/assets
# (panel/index.html + panel-assets/*, copied from the website repo's
# specs/002-ellie-platform/panel bundle). The Worker serves /panel
# itself (for the framing headers, reading the page from this binding)
# and /panel-assets/* from this binding.
[assets]
directory = "./assets"
binding = "ASSETS"
# The Worker runs first: it serves /panel itself (framing headers) and
# delegates /panel-assets/* to the assets binding.
run_worker_first = true

[vars]
# Ellie model configuration (OpenRouter only — AI-PROVIDER-POLICY).
# Model lists are ordered: the first that answers serves the call.
# WS-15 (2026-10-26): the ACTIVE lists are the free models, in order
# (primary first). Both Gemma 4 free models are multimodal, so the
# text and vision lists are the same. Every request still pins
# data_collection: deny (see packages/platform/src/ellie/openrouter.ts).
ELLIE_MODELS_TEXT = "google/gemma-4-31b-it:free,google/gemma-4-26b-a4b-it:free"
ELLIE_MODELS_VISION = "google/gemma-4-31b-it:free,google/gemma-4-26b-a4b-it:free"
# Paid models are LISTED here only, so a future explicit decision can
# enable them. They are never called as a silent fallback: paid calls
# happen only when ELLIE_ALLOW_PAID_FALLBACK is set to "true" by a
# deliberate configuration change (it is not set here).
ELLIE_MODELS_PAID_TEXT = "meta-llama/llama-3.3-70b-instruct,openai/gpt-4o-mini"
ELLIE_MODELS_PAID_VISION = "meta-llama/llama-3.2-11b-vision-instruct,openai/gpt-4o-mini"
# Per-user daily cap on free-route model calls (WS-15). When a user
# reaches it, Ellie answers with the plain-language free-tier limit
# message (resets at midnight UTC) instead of an error.
ELLIE_FREE_DAILY_USER_CAP = "30"
# Daily model spend cap in USD (plan Tripwire 2); the engine refuses
# model calls once the day's ellie_usage total reaches it.
ELLIE_DAILY_SPEND_CAP_USD = "5"
