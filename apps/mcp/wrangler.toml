# ElectroHire remote MCP server Worker.
# This committed config IS the deploy config for the beta surface
# (follow-up 2026-10-24): the custom-domain route and the D1 binding to
# the platform store (electrohire-platform) are committed, so a deploy
# from this file reproduces the served end state — DB binding +
# CONTENT_SOURCE_URL only; the old EH_LOCAL_* seed vars are gone (with
# DB bound, the gate resolves from D1 and seeds are never read).
name = "electrohire-mcp"
main = "src/index.ts"
compatibility_date = "2025-06-01"
routes = [{ pattern = "mcp-beta.electrohire.com", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "electrohire-platform"
database_id = "c7aea331-7159-438c-a957-51632558a3c9"

[vars]
# Content mirror source (C-01): the website build emits this document.
# Local dev overrides with CONTENT_JSON via wrangler --var / .dev.vars.
CONTENT_SOURCE_URL = "https://electrohire-website-staging.pages.dev/content/v1.json"
# Phase E: the Ellie MCP tools (electrohire_ellie_session /
# electrohire_ellie_analysis) run the shared Ellie engine against the
# same D1 binding. OPENROUTER_API_KEY is a SECRET (placed separately
# with `wrangler secret put`, never a value in this file).
# WS-15 (2026-10-26): the ACTIVE lists are the free models, in order
# (primary first). Both Gemma 4 free models are multimodal, so the
# text and vision lists are the same. Every request still pins
# data_collection: deny (see packages/platform/src/ellie/openrouter.ts).
ELLIE_MODELS_TEXT = "google/gemma-4-31b-it:free,google/gemma-4-26b-a4b-it:free"
ELLIE_MODELS_VISION = "google/gemma-4-31b-it:free,google/gemma-4-26b-a4b-it:free"
# Paid models are LISTED here only, so a future explicit decision can
# enable them. They are never called as a silent fallback: paid calls
# happen only when ELLIE_ALLOW_PAID_FALLBACK is set to "true" by a
# deliberate configuration change (it is not set here).
ELLIE_MODELS_PAID_TEXT = "meta-llama/llama-3.3-70b-instruct,openai/gpt-4o-mini"
ELLIE_MODELS_PAID_VISION = "meta-llama/llama-3.2-11b-vision-instruct,openai/gpt-4o-mini"
# Per-user daily cap on free-route model calls (WS-15). When a user
# reaches it, Ellie answers with the plain-language free-tier limit
# message (resets at midnight UTC) instead of an error.
ELLIE_FREE_DAILY_USER_CAP = "30"
ELLIE_DAILY_SPEND_CAP_USD = "5"
